# ============================================================
# configs/config_matrix.yaml
#
# 阶段：P1.1（**草案** —— 正式冻结在 P1.5，本单不冻结）
# 依据：P1.1 任务单第三节
# 编码约定：UTF-8 无 BOM，LF 换行
#
# 说明：
#   * 本文件是**配置矩阵草案**，供 P1.5 冻结与 P2 云窗口执行预算使用。
#   * **噪声强度档位定义方式（双口径，必须同时给出）**：
#       (i)  target_input_snr_db —— 目标输入 SNR（dB）
#       (ii) amplitude_ratio    —— 相干/随机噪声相对干净数据的振幅比例
#     两种口径都写入，以免后续争议"强度是什么"。
#   * **每配置 >= 5 个独立随机种子，且显式列出数值**。
# ============================================================

meta:
  stage: P1.1-draft
  frozen: false                # 正式冻结在 P1.5（tag: config-frozen）
  note: "本文件为草案；P1.1 不冻结、不建 tag"

# ------------------------------------------------------------
# 采样与几何（书面固定）
# ------------------------------------------------------------
acquisition:
  dt_s: 0.002          # 时间采样间隔 (s)  -> dt = 2 ms
  dx_m: 10.0           # 道间距 (m)
  n_samples: 512       # 时间样点数（主模型正演后的输出长度见 forward 约定）
  n_traces: 64         # 道数

# ------------------------------------------------------------
# 主频档位（与已冻结的 n_T 三元组一致）
# ------------------------------------------------------------
wavelet:
  kind: ricker
  f_main_hz: [15.0, 25.0, 40.0]     # 主频档位（协议冻结值）
  # n_T = round_half_up(1/(f_main*dt)) 的三元组（P1.5 冻结时逐配置记录）
  n_T_records:
    - {f_main_hz: 15.0, n_T_expr: "1/(f_main*dt)", n_T_rule: "half_up: math.floor(x + 0.5)", n_T_int: 33}
    - {f_main_hz: 25.0, n_T_expr: "1/(f_main*dt)", n_T_rule: "half_up: math.floor(x + 0.5)", n_T_int: 20}
    - {f_main_hz: 40.0, n_T_expr: "1/(f_main*dt)", n_T_rule: "half_up: math.floor(x + 0.5)", n_T_int: 13}

# ------------------------------------------------------------
# 模型（两个）
# ------------------------------------------------------------
models:
  - id: M1
    name: layered-horizontal        # 主模型：水平层状
    params:
      n_layers: 200
      sparsity: 0.30
  - id: M2
    name: structure-dip-curv-fault  # 第二模型：倾斜 + 弯曲 + 断层（+可选横向变速）
    params:
      n_samples: 512
      n_traces: 64
      n_events: 6
      dip_deg_range: [-18.0, 18.0]
      curvature_range: [-0.35, 0.35]
      fault_trace_fraction: 0.5
      fault_throw_samples: 25.0
      lateral_velocity_gradient: 0.0    # 0=关闭；可设 >0 启用横向速度变化
      sparsity: 0.55

# ------------------------------------------------------------
# 噪声类型（三类，协议规定）
# ------------------------------------------------------------
noise_types:
  - id: N1
    name: band_limited_random
    params:
      band_hz: [5.0, 80.0]
  - id: N2
    name: linear_coherent
    params:
      f_main_hz: 30.0
      v_app_m_s: [800.0, 1500.0, 3000.0]   # 参数档位（视速度）
  - id: N3
    name: dispersive_surface_wave
    params:
      v_model: linear                       # v(f) = v0 + c*f  （**必填**，无默认值，见 R15-b）
      v0: 500.0                             # 必填
      c: 10.0                               # 必填
      # R15-a：解析 v(f) 在整个预注册频带上必须落在下列物理区间内。
      # 该区间为**冻结参数候选值**（P1.5 冻结）。浅层近地表面波相速度经验范围约
      # 100–3000 m/s；下限覆盖软土低速，上限覆盖硬岩/厚层高速。
      dispersion_v_band_mps: [100.0, 3000.0]
      f_lo_hz: 5.0
      f_hi_hz: 25.0
      n_components: 24
      probe_freqs_hz: [5.0, 8.0, 12.0, 15.0, 18.0, 22.0, 25.0]   # 预注册探测频率（>=5，覆盖两端与中部）

# ------------------------------------------------------------
# 噪声强度档位（>=3 档；**双口径**定义）
# ------------------------------------------------------------
noise_levels:
  - id: L1
    target_input_snr_db: 10.0     # 口径 (i)：目标输入 SNR (dB)
    amplitude_ratio: 0.30         # 口径 (ii)：相对干净数据振幅的比例
  - id: L2
    target_input_snr_db: 0.0
    amplitude_ratio: 0.60
  - id: L3
    target_input_snr_db: -5.0
    amplitude_ratio: 1.00
  # 说明：三档为 >=3 档的最小集；P1.5 可增档但不得减档。
  # 两种口径的对应关系由实测标定（同一 amplitude_ratio 下测得的 input SNR 写入 execution-log）。

# ------------------------------------------------------------
# 随机种子（**显式列出数值**，每配置 >= 5 个）
# ------------------------------------------------------------
seeds:
  - 101
  - 202
  - 303
  - 404
  - 505

# ------------------------------------------------------------
# 配置矩阵组合规则（笛卡尔积）
# ------------------------------------------------------------
matrix:
  axes:
    - models          # 2 个：M1, M2
    - noise_types     # 3 类：N1, N2, N3
    - noise_levels    # 3 档：L1, L2, L3
    - param_slots     # 参数档位：见下
  param_slots:
    # 参数档位的具体取值（用于展开笛卡尔积的 "参数档位" 轴）
    wavelet_f_main_hz: [15.0, 25.0, 40.0]
    n2_v_app_m_s: [800.0, 1500.0, 3000.0]
  seeds_per_config: 5
  seeds: [101, 202, 303, 404, 505]

# ------------------------------------------------------------
# 展开算式（由 src/... 的成本脚本实测核对，见 execution-log）
# ------------------------------------------------------------
expansion:
  formula: "(2 models) x (3 noise types) x (3 levels) x (3 f_main) = 54 configs"
  configs_total: 54
  observations_total_formula: "54 configs x 5 seeds = 270 observations"
  observations_total: 270

# ------------------------------------------------------------
# R15（P1.1-Am1 整改）· 频散参数与物理区间
# ------------------------------------------------------------
dispersion_physics:
  # 验收 c 的硬断言区间（越界即 fail，不得只警告）
  v_band_mps: [100.0, 3000.0]
  band_rationale: "浅层近地表面波相速度经验范围约 100-3000 m/s；下限覆盖软土低速、上限覆盖硬岩/厚层高速"
  # 参数必填（无静默默认值）：v_model / v0 / c / a / b / f_lo / f_hi
  required_params: [v_model, v0, c, a, b, f_lo, f_hi]
  frozen_on: P1.5

# ------------------------------------------------------------
# R16（P1.2-Am2 整改）· CNA 子空间建基规则（**P1.5 冻结**）
# ------------------------------------------------------------
cna_subspace:
  construction: "分量基精确张成（禁用抽样建基）"
  rationale: >
    禁用抽样建基的三条理由（**更正 2，2026-09-25 改写；原"不收敛"表述不准确，已删**）：
    （1）需要 >= 48 个**同一参数族**的实现才能张成该家族（实测 k=48 与 k=60 均可达 0.0000%，
         即抽样在 k >= 家族维数时**收敛**，并非不收敛）；
    （2）**参数一变家族就变**——v0 / c / f_lo / f_hi / n_components 任一变化都需重新抽样；
    （3）模板集合依赖**任意种子选择**，可复现性与参数显式性都差。
    故以**分量基**为准（精确张成、参数显式、确定性）。
  empirical_dimension:
    value: 48
    equals: "2 * n_components"
    verification: "60 个独立实现做 SVD：第 48 个相对奇异值 4.842e-08，第 49 个 6.782e-16（断层下跌）"
  grid_dependency_warning:
    status: "**R-N1 已更正（2026-09-25）**"
    mechanism: >
      面波家族在 (n_samples x n_traces) 矩阵上的**秩上限 = min(n_samples, n_traces, 2*n_components)**。
      当 min(n_samples, n_traces) < 2*n_components 时，家族被**秩亏压缩**；
      若抽样数 k >= 该压缩秩，则**恰好精确张成**，回收误差趋于 0（与"谱衰减"无关）。
    verified_config_of_the_0p058pct_row:
      grid: [256, 16]
      min_ns_ntr: 16
      n_components: 24
      theoretical_rank_cap: 16
      measured_single_impl_matrix_rank: [16, 16, 16]
      basis_seeds: "96000..96039"
      test_seeds: "97000..97009"
      k: 40
      recovery_error_median: 0.0561
      note: "k=40 > 秩上限 16 ⇒ 越过族维 ⇒ 精确张成 ⇒ 残差≈0"
    rerun_with_registered_family_and_grid:
      family: "n_components=24（注册族）"
      grid: [512, 64]
      seeds: "basis 96000..96039 / test 97000..97009（不相交）"
      k40_recovery_median: 43.40
      k47_recovery_median: 13.60
      k48_recovery_median: 0.00
      k20_recovery_median: 74.55
    corrected_statement: >
      「k=40 的回收误差随观测网格变化（本执行方实测 0.058%–43.4%；签发方实测 13.8%–34.2%）；
       **≈0 只出现在 k >= 家族（压缩后）维数」**。
      两方数值差异源于随机实现协议（种子/幅度相位抽样）不同，**属同一机制的不同实现细节**；
      但**"两种网格下都对"的并列说法已撤销** —— 0.058% 只反映"256x16 把族压到 16 维"这一特例。
    rule: "凡回收/回放类测量，**必须使用注册配置网格 (512,64)**（本项写入 P1.5 冻结清单）"
  basis_sources:
    linear_coherent:
      function: "bench.data.synthetic.linear_coherent_basis"
      dimension_per_param_set: 1        # 唯一随机量是整体幅度
      coverage:
        v_app_m_s: [800.0, 1500.0, 3000.0]     # 注册视速度档
        f_main_hz: [15.0, 25.0, 40.0]          # 注册主频档
        plus_injection_point: true              # 另加注入实际使用的 (v_app, f_main)
    dispersive_surface_wave:
      function: "bench.data.synthetic.dispersion_component_basis"
      dimension_per_param_set: "2 * n_components"   # sin 与 cos 各 1 维
      coverage:
        f_axis_rule: "np.linspace(f_lo, f_hi, n_components)"   # 与注入实现**同一规则**
        v_model: linear
        v0: 500.0
        c: 10.0
        n_components: 24
  rank_tol:
    candidate: 1.0e-8
    semantics: "保留奇异值 >= rank_tol * sigma_max 的方向；P1.5 冻结"
  frozen_on: P1.5
  prohibition: "不得再用“抽 N 个随机实现”建基（已实测不收敛）"

# ------------------------------------------------------------
# 裁定 E（预注册）· 两个噪声强度口径的关系
# ------------------------------------------------------------
noise_level_semantics:
  criterion_i:
    name: "target_input_snr_db"
    role: "**规范口径（normative）**"
    usage: "对外报告与三态判定以此为准；协议首要质量指标即以 SNR 表达"
    requirement: "每个观测的**实测输入 SNR 必须逐个记录并报告**（不得按名义值假定）"
  criterion_ii:
    name: "amplitude_ratio"
    role: "**描述性口径（descriptive）**"
    usage: "仅用于生成实现；不作为对外声明"
  mapping_policy:
    rule: "按实测冻结；**不得强行统一为单一映射**"
    table_dimensions: "模型 x 噪声类型 x 档位"
    on_significant_difference: "如实并列，并在论文说明「档位以输入 SNR 为准」"

# 实测标定表（网格 512x64 = 注册配置；种子 101/202/303 取中位；2026-09-25 实测）
calibration_table:
  grid: [512, 64]
  seeds: [101, 202, 303]
  # amplitude_ratio -> 实测输入 SNR (dB)
  rows:
    - {model: M1, noise: N1_band_limited_random, level: L1, amplitude_ratio: 0.30, snr_median_db: 10.46, snr_range_db: [10.46, 10.46]}
    - {model: M1, noise: N1_band_limited_random, level: L2, amplitude_ratio: 0.60, snr_median_db: 4.44,  snr_range_db: [4.44, 4.44]}
    - {model: M1, noise: N1_band_limited_random, level: L3, amplitude_ratio: 1.00, snr_median_db: 0.00,  snr_range_db: [-0.00, 0.00]}
    - {model: M2, noise: N1_band_limited_random, level: L1, amplitude_ratio: 0.30, snr_median_db: 10.46, snr_range_db: [10.46, 10.46]}
    - {model: M2, noise: N1_band_limited_random, level: L2, amplitude_ratio: 0.60, snr_median_db: 4.44,  snr_range_db: [4.44, 4.44]}
    - {model: M2, noise: N1_band_limited_random, level: L3, amplitude_ratio: 1.00, snr_median_db: 0.00,  snr_range_db: [-0.00, 0.00]}
    - {model: M1, noise: N3_dispersive_surface, level: L1, amplitude_ratio: 0.30, snr_median_db: 10.46, snr_range_db: [10.46, 10.46]}
    - {model: M1, noise: N3_dispersive_surface, level: L2, amplitude_ratio: 0.60, snr_median_db: 4.44,  snr_range_db: [4.44, 4.44]}
    - {model: M1, noise: N3_dispersive_surface, level: L3, amplitude_ratio: 1.00, snr_median_db: -0.00, snr_range_db: [-0.00, 0.00]}
    - {model: M2, noise: N3_dispersive_surface, level: L1, amplitude_ratio: 0.30, snr_median_db: 10.46, snr_range_db: [10.46, 10.46]}
    - {model: M2, noise: N3_dispersive_surface, level: L2, amplitude_ratio: 0.60, snr_median_db: 4.44,  snr_range_db: [4.44, 4.44]}
    - {model: M2, noise: N3_dispersive_surface, level: L3, amplitude_ratio: 1.00, snr_median_db: 0.00,  snr_range_db: [-0.00, 0.00]}
    - {model: M1, noise: N2_linear_coherent, level: null, amplitude_ratio: null, snr_median_db: 11.12, snr_range_db: [10.48, 16.10]}
    - {model: M2, noise: N2_linear_coherent, level: null, amplitude_ratio: null, snr_median_db: 13.90, snr_range_db: [7.55, 14.84]}
  findings:
    - "N1 与 N3：两模型映射**完全一致**（差 0.00 dB），因噪声按干净数据 RMS 归一化，SNR 由 ratio 唯一决定"
    - "N2（线性相干干扰）：**口径 (ii) 不适用** —— add_linear_coherent 的幅度由内部随机源给出
       (uniform 0.5-1.5)，**不接受 amplitude_ratio 参数**；三档 SNR 完全相同"
    - "N2 下 M1 (11.12 dB) 与 M2 (13.90 dB) 相差 **2.78 dB** ⇒ 映射**不统一**，按裁定 E 如实并列"
  frozen_on: P1.5
