    envelope_threshold: {median: 0.020173, mad: 0.007981, k_mad: 3.0}
    figure: docs/figures/p1_field_panel_3.png

# 融合保守度 3 档标称值（草案，语义见下；正式冻结在 P1.5）
fusion_conservativeness_draft:
  semantics: >
    "保守度"控制融合权重对相干噪声鉴别分数的响应强度：
    越保守 => 越接近输入（越少改动被测数据）；越激进 => 越充分抑制相干噪声但可能损伤信号。
    参数化为相干噪声权重抑制系数 gamma：修正后权重 w' = w * (1 - gamma * s)，s 为鉴别分数。
  levels:
    - {id: G_nom, gamma: 0.50, note: "标称值"}
    - {id: G_minus20, gamma: 0.40, note: "标称值 -20%"}
    - {id: G_plus20, gamma: 0.60, note: "标称值 +20%"}
  frozen_on: P1.5


# ------------------------------------------------------------
# 选定结果与理由（按**已冻结判据**排序，非事后挑选）
# ------------------------------------------------------------
selection_outcome:
  rule_used: "P1 相干能量比降序 -> P2（见下：无区分力）-> P3 横向相干降序 -> 位置 tie-break"
  coverage: "MV=2, NAN=1（满足两测区覆盖）"
  coverage_rationale: >
    严格排序前三即为 2+1，**无需**为凑覆盖而替换任何面板；
    故本选定完全由冻结判据决定，不含人为取舍。

criterion_defects_found:
  - id: outlier_trace_fraction
    issue: >
      阈值 < 0.05 **不可满足**：40 个候选实测取值范围 0.0595–0.5165（中位 0.2410），
      **无一满足**。定义失当——炮集振幅随炮检距与时间天然剧烈变化，
      逐道 RMS 分布本就宽，用"偏离中位 ±3 倍"衡量对炮集无意义。
    impact: "P2 的该项**无区分力**；本批选取实际由 P1（相干能量比）与 P3（横向相干）决定。"
    handling: >
      **本批不改判据**（判据已先冻结，事后改即违规）；如实记录该缺陷，
      并在 P1.5 冻结时修正为炮集适用的坏道判据（如"相邻道波形相关系数低于阈值"）。
  - id: dead_trace_fraction
    issue: "40/40 全部满足（max 0.0010），**亦无区分力**（但方向正确，非缺陷定义错误）。"
    impact: "同上，P2 整体未参与实际排序。"

honest_notes:
  - "FP3 的 n_events = 0：在 k_mad = 3.0 阈值下该面板包络未检出任何超阈区段。如实记录。"
  - "三个面板的倾角中位均在 82–85 度：原始炮集上主要能量为近垂直的初至/地滚波，"
  - "  该量仅作说明性记录，不参与面板选取（判据 P3 用的是横向相干，不是倾角）。"

