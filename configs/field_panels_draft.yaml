# ============================================================
# configs/field_panels_draft.yaml
#
# P1.3 野外 3 面板/时窗选定（**草案** —— 正式冻结在 P1.5）
# 编码约定：UTF-8 无 BOM，LF 换行
#
# ⚠️ 时序约束（协议硬规则，违反即本单作废）
#   选择过程中**不得运行任何去噪方法**，**不得参考任何去噪/滤波结果**。
#   本文件中的全部量**均由原始数据直接定义**（无滤波、无 f-k 滤波、无反褶积、无分解、无低秩、无 DL）。
# ============================================================

meta:
  stage: P1.3-draft
  frozen: false
  frozen_on: P1.5
  source_doi: "10.5281/zenodo.10407771"
  source_files:
    MV: "data/field/zenodo-mv/mv1001shots_subset8000.sgy"     # Martha's Vineyard 测区
    NAN: "data/field/zenodo-mv/nan3001shots_subset8000.sgy"   # Nantucket 测区
  acquisition:
    n_traces: 8000
    n_samples: 5000
    dt_s: 0.001            # 1 ms
    record_length_s: 5.0
    format_code: 1         # IBM 32-bit float
    bytes_per_trace: 20240

# ------------------------------------------------------------
# 事前判据（**在看到任何测量结果之前冻结**，2026-09-25）
#
# 选择优先级（依任务单"优先包含相干噪声明显的区间"）：
#   P1 相干噪声显著（地滚波/水中波/线性干扰能量占比高）
#   P2 几何与质量完整（坏道/死道比例低）
#   P3 反射同相轴可辨（原始数据上的横向相干性）
# 三者冲突时按 P1 > P2 > P3 取舍；同分时取更早的时间窗（确定性 tie-break）。
# ------------------------------------------------------------
preregistered_criteria:
  frozen_at: "2026-09-25"
  priority_order: [coherent_noise_prominence, geometry_quality, reflector_visibility]

  # —— 检查项（逐项写明"测什么、怎么测、如何判"）——
  inspected_raw_quantities:
    - id: dead_trace_fraction
      what: "死道比例：整道 RMS 低于该面板中位 RMS 的 1%"
      why: "几何完整性（P2）"
      good: "< 0.05"
    - id: outlier_trace_fraction
      what: "异常道比例：整道 RMS 偏离中位 ±3 倍范围"
      why: "几何完整性（P2）"
      good: "< 0.05"
    - id: coherent_energy_ratio
      what: >
        相干能量占比：在 f-k 幅度谱上，取 |k|>=k_min 且 f<=f_max 的"低速相干区"能量，
        除以全谱能量。**仅计算谱，不做任何滤波**。
      why: "相干噪声显著性（P1）"
      good: "越高越优先"
    - id: low_freq_energy_ratio
      what: "低频能量占比：f <= 15 Hz 的能量 / 全频带能量（原始道集，逐道平均）"
      why: "地滚波/面波通常集中在低频（P1 佐证）"
      good: "越高越优先"
    - id: lateral_coherence
      what: >
        横向相干性：相邻道零延迟互相关的绝对值中位（原始数据，无滤波）。
        真实反射同相轴在相邻道上相似度高。
      why: "反射同相轴可辨性（P3）"
      good: "越高越优先"
  # —— 派生项 ——
  panel_definition: "面板 = 道范围 [t0,t1) × 时间窗 [s0,s1) 的组合"
  coverage_requirement: "3 个面板须覆盖两个测区（2+1 或 1+2，须给理由）"
  tie_break: "同分时取道号与时间窗都更早者（确定性，防事后挑选）"

# ------------------------------------------------------------
# 候选区间网格（**先固定网格，再在其中选择**，避免任意挑选）
# 道：8000 道按 2000 道切片 -> 4 块
# 时间：5000 样点按 1000 样点切片 -> 5 块
# 候选组合 = 4 x 5 = 20 个/测区，共 40 个；在其中选 3 个。
# ------------------------------------------------------------
candidate_grid:
  trace_blocks: [[0, 2000], [2000, 4000], [4000, 6000], [6000, 8000]]
  time_blocks_samples: [[0, 1000], [1000, 2000], [2000, 3000], [3000, 4000], [4000, 5000]]

# 选定的 3 个面板（**待填写**；由测量结果按上述判据确定）
panels:
  - panel_id: FP1
    region: NAN
    trace_range: [2000, 4000]
    sample_range: [0, 1000]
    time_window_ms: [0.0, 1000.0]
    measured_raw_quantities:
      coherent_energy_ratio: 0.3777
      lateral_coherence: 0.1309
      dead_trace_fraction: 0.0
    n_events: 1
    event_windows_samples: [[0, 356]]
    n_T_samples: 40
    dip_median_deg: 82.168
    envelope_threshold: {median: 0.063831, mad: 0.038307, k_mad: 3.0}
    figure: docs/figures/p1_field_panel_1.png
  - panel_id: FP2
    region: MV
    trace_range: [4000, 6000]
    sample_range: [1000, 2000]
    time_window_ms: [1000.0, 2000.0]
    measured_raw_quantities:
      coherent_energy_ratio: 0.3562
      lateral_coherence: 0.1787
      dead_trace_fraction: 0.0
    n_events: 3
    event_windows_samples: [[83, 134], [137, 195], [270, 326]]
    n_T_samples: 40
    dip_median_deg: 84.983
    envelope_threshold: {median: 0.031806, mad: 0.008486, k_mad: 3.0}
    figure: docs/figures/p1_field_panel_2.png
  - panel_id: FP3
    region: MV
    trace_range: [2000, 4000]
    sample_range: [1000, 2000]
    time_window_ms: [1000.0, 2000.0]
    measured_raw_quantities:
      coherent_energy_ratio: 0.3544
      lateral_coherence: 0.2058
      dead_trace_fraction: 0.0
    n_events: 0
    event_windows_samples: []
    n_T_samples: 40
