# ---------------------------------------------------------------- 6 掩码与事件窗
item_06_mask_and_event_window:
  source: {file: 'docs/task-sheets/P0.3-Am1-nT裁定与外部写入处置-2026-09-25.md', sha8: '2DD96C71'}
  also_from: [{file: 'docs/task-sheets/P0.3-Am3-代码同源判定与数值约定核定-2026-09-25.md', sha8: '5F2F160E'}, {file: 'docs/task-sheets/P1.3-Am1-面板选定验收与网格数字再核-2026-10-02.md', sha8: '87A4FA6A'}]
  n_T_expr: '1/(f_main*dt)'
  n_T_rule: 'half_up (math.floor(x + 0.5))'
  n_T_rule_note: >
    **取整口径澄清**：现行实现与全部测试均为 half-up（math.floor(x+0.5)）；
    历史 execution-log 的 R4 注记写作「round（Python 内建 round 行为）」，该括号表述
    **已被 half-up 取代**（40 Hz @ dt=2 ms：half-up = 13；Python round 会得 12）。
    本条以**现行实现值**冻结，并禁止使用 round/floor(裸)/ceil/截断。
  n_T_per_config:
    - {f_main_hz: 15.0, n_T_expr: '1/(f_main*dt)', n_T_rule: half_up, n_T_int: 33,
       boundary_min_distance_samples: 17}
    - {f_main_hz: 25.0, n_T_expr: '1/(f_main*dt)', n_T_rule: half_up, n_T_int: 20,
       boundary_min_distance_samples: 10}
    - {f_main_hz: 40.0, n_T_expr: '1/(f_main*dt)', n_T_rule: half_up, n_T_int: 13,
       boundary_min_distance_samples: 7}
  event_mask_threshold:
    rule: 'threshold = 0.5 * max|clean|（**相对系数预注册**；逐观测套用）'
    rationale: >
      绝对阈值会随模型/种子/主频的振幅标度漂移；以 max|clean| 的相对系数预注册，
      既可复现又有物理含义（半高）；0.5 亦与既有验收测试使用的口径一致。
    sensitivity_measured:
      - {model: M1, frac_of_max: 0.3, mask_frac_undilated: 0.1348, mask_frac_dilated: 0.3652}
      - {model: M1, frac_of_max: 0.4, mask_frac_undilated: 0.0762, mask_frac_dilated: 0.2285}
      - {model: M1, frac_of_max: 0.5, mask_frac_undilated: 0.0430, mask_frac_dilated: 0.1465}
      - {model: M1, frac_of_max: 0.6, mask_frac_undilated: 0.0234, mask_frac_dilated: 0.1133}
      - {model: M1, frac_of_max: 0.7, mask_frac_undilated: 0.0117, mask_frac_dilated: 0.0566}
      - {model: M2, frac_of_max: 0.3, mask_frac_undilated: 0.0359, mask_frac_dilated: 0.0836}
      - {model: M2, frac_of_max: 0.4, mask_frac_undilated: 0.0250, mask_frac_dilated: 0.0779}
      - {model: M2, frac_of_max: 0.5, mask_frac_undilated: 0.0125, mask_frac_dilated: 0.0496}
      - {model: M2, frac_of_max: 0.6, mask_frac_undilated: 0.0111, mask_frac_dilated: 0.0482}
      - {model: M2, frac_of_max: 0.7, mask_frac_undilated: 0.0096, mask_frac_dilated: 0.0467}
    chosen_frac_of_max: 0.5
  dilation_axis: '仅沿时间轴（axis=0）；**不作用于道方向**（axis=1 恒宽 1）'
  anchor_rule: 'left = n_T // 2；right = n_T - 1 - left（显式写死，不依赖库默认锚点）'
  event_distance_from_boundary: '>= ceil(n_T/2) 样点（C5 义务）'
  c5_boundary_check_measured: {"M1": {"n_T": 20, "half_ceil": 10, "masked_rows": 22, "rows_violating": 0}, "M2": {"n_T": 20, "half_ceil": 10, "masked_rows": 27, "rows_violating": 0}}
  fp_fallback_ladder:
    rule: 'k_mad = 3.0 起，若事件窗 < 2 则按序试 2.5 -> 2.0 -> 1.5，取首个 >= 2 窗者；直至 1.5 仍 <2 则记 N/A'
    per_panel_chosen: {FP1: 1.5, FP2: 3.0, FP3: 2.5}
    per_panel_ladder: {FP1: [1, 1, 1, 2], FP2: [3], FP3: [0, 3]}
    status: '事前声明（P1.3-Am1 裁定 F）；三面板均达 >= 2 窗，无需 N/A'

# ---------------------------------------------------------------- 7 数值约定 C1-C6
item_07_numeric_conventions_C1_C6:
  source: {file: 'docs/task-sheets/P0.3-Am3-代码同源判定与数值约定核定-2026-09-25.md', sha8: '5F2F160E'}
  C1_snr_db_perfect: '||y-s||_2 == 0 -> 返回 +inf 并置标志（不抛异常、不返回 NaN）'
  C2_delta_snr_double_perfect: 'x == s 且 y == s -> 显式 return 0.0（主实验输入均含注入噪声，该分支不参与主结果）'
  C3_flag_semantics: '标志仅反映输出去噪项，不得被 snr_db(s,x) 污染（不可变 SnrOutcome，取代模块级全局标志）'
  C4_zero_size_array: '视作非法输入 -> raise ValueError（不得被误判为「完美去噪」）'
  C5_mask_boundary: '数组端窗口按「越界即不贡献」截断，**不环绕**；贴边事件掩码支撑 < n_T'
  C5_obligation: '事件窗选择须使事件距数组边界 >= ceil(n_T/2)'
  C6_anchor: 'left = n_T//2、right = n_T-1-left，显式写死，不依赖库默认锚点'

# ---------------------------------------------------------------- 8 CNA 建基规则
item_08_cna_basis:
  source: {file: 'docs/task-sheets/P1.2-Am2-CNA子空间张成阻断整改-2026-10-01.md', sha8: '3A0E0E8E'}
  also_from: [{file: 'docs/task-sheets/P1.2-Am3-验收通过与两处更正两项裁定-2026-10-01.md', sha8: '3A120A2E'}]
  construction: '分量基精确张成（**禁用抽样建基**）'
  components:
    linear_coherent: {function: 'bench.data.synthetic.linear_coherent_basis', dimension_per_param_set: 1, v_app_m_s: [800.0, 1500.0, 3000.0], f_main_hz: [15.0, 25.0, 40.0], plus_injection_point: true}
    dispersive_surface_wave: {function: 'bench.data.synthetic.dispersion_component_basis', dimension_per_param_set: '2 * n_components', f_axis_rule: 'np.linspace(f_lo, f_hi, n_components)', v_model: linear, v0: 500.0, c: 10.0, n_components: 24}
  rank_tol: 1.0e-8
  rank_tol_semantics: '保留奇异值 >= rank_tol * sigma_max 的方向'
  rank_tol_status: '确认（沿用既有实现值）'
  sampling_basis_prohibited:
    rule: '禁止以「抽 N 个随机实现」建基'
    reasons:
      - '需要 >= 48 个同一参数族的实现才能张成该家族（实测 k=48 与 k=60 均达 0.0000%，抽样在 k >= 家族维数时收敛）'
      - '参数一变家族就变（v0/c/f_lo/f_hi/n_components 任一变化都需重新抽样）'
      - '模板集合依赖任意种子选择，可复现性与参数显式性都差'
  grid_rule: '凡回收/回放类测量，必须使用注册配置网格 (512, 64)'
  grid_dependency_statement_corrected: >
    「k=40 的回收误差随观测网格变化（本执行方实测 0.058%-43.4%；签发方实测 13.8%-34.2%）；
    **≈0 只出现在 k >= 家族（压缩后）维数**」。
    `min(n_samples, n_traces, 2*n_components)` 是**单个实现作为矩阵的秩上界**，**不是家族维数**；
    家族维数由**多个独立实现展平后张成的子空间**决定，实测两网格**均为 48**（= 2*n_components）。
  withdrawn_row_retracted: >
    「256x16 上 k=40 回收误差中位 0.0561%」**已撤回**：该行 n_components = 24，
    **其运行脚本未入库，成因无法确证**；可证事实仅为「不可在注册参数族下复现」
    （签发方同网格同族得 13.8323%），以及两实验奇异值谱相差约 500 倍（抽样不等价）。
  standing_rule_15: '证据性判定的四要件（见 docs/quarantine-register.md）'

