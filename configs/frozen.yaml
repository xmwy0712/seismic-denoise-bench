# ---------------------------------------------------------------- 10 融合保守度 3 档
item_10_fusion_conservativeness:
  source: {file: 'docs/task-sheets/P1.3-野外3面板选定-2026-10-02.md', sha8: '0EFEBA6B'}
  semantics: >
    「保守度」控制融合权重对相干噪声鉴别分数的响应强度：越保守 = 越接近输入；
    参数化为相干噪声权重抑制系数 gamma：修正后权重 w' = w * (1 - gamma * s)，s 为鉴别分数。
  levels:
    - {id: G_minus20, gamma: 0.4, note: '标称值 -20%'}
    - {id: G_nom, gamma: 0.5, note: 标称值}
    - {id: G_plus20, gamma: 0.6, note: '标称值 +20%'}
  settings_count: '3 面板 x 3 档保守度 = 9 个预注册野外设置'
  frozen_on: P1.5

# ---------------------------------------------------------------- 11 野外权重与统计规则
item_11_field_weights_and_stats:
  source: {file: 'docs/protocol-v5.md', sha8: '67472625'}
  also_from: [{file: 'README.md', sha8: 'B48DEFA1'}]
  field_metrics_weights:
    amplitude_preservation: 0.30    # 振幅保持
    spectral_residual: 0.25         # 频谱残差
    event_continuity: 0.25          # 同相轴连续性
