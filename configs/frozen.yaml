# ---------------------------------------------------------------- 12 f-k 符号约定
item_12_fk_sign_convention:
  source: {file: 'docs/task-sheets/P0.4-Am2-独立性判据与fk符号纠错-2026-09-25.md', sha8: '456AF58B'}
  transform_kernel: 'exp(-2*pi*i*(f*t + k*x))  （numpy.fft.fft2 的核）'
  ridge: 'g(t,x) = W(t - x/v) -> G(f,k) = W_hat(f) * delta(k + f/v) -> 脊线 k = -f/v'
  quadrant: 'f > 0 时脊位于 k < 0；回算须在 (f>0, k<0) 象限搜索，取 v = f/|k|'
  warning: '**若改用 exp(-2*pi*i*(f*t - k*x)) 的约定，则符号相反（k = +f/v）**；复现者须先确认变换核符号'

