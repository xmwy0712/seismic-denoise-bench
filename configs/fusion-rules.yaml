    correction: Holm（族同 P2.3）
    comparisons:
    - vs method_i
    - vs method_j
    - vs best single method
    all_gamma_levels_reported: true
    primary_conclusion_binds_primary_pair: true
  tag_before_implementation: fusion-rules-frozen
