# ------------------------------------------------------------
# 裁定 I 降级说明（2026-10-03）
# ------------------------------------------------------------
# 协议第 18 行写的是「**许可合格的预训练**深度学习」⇒ DL 槽位是**预训练模型做推理**，
# **不涉及我方训练**。故本件**降级**如下：
#
#   · 若最终采用**预训练模型（纯推理）** → 本件**不适用**；
#     改以「**推理确定性 + 权重哈希 + 版本锁定**」三件代替训练协议：
#       1. 推理确定性：同权重同输入两次推理逐字节相同（GPU 非确定性须**实测并记录**）；
#       2. 权重哈希：下载渠道 + 版本锁定 + SHA256 逐文件登记；
#       3. 版本锁定：框架与权重版本入 requirements.lock / 环境注记。
#   · 若核验后决定**微调** → **微调算训练**，须**另批训练协议**（本节以下内容届时再启用）。
downgrade_effective: 'pre-trained inference path (no training)'
alternative_if_finetuning: '另批训练协议（本节以下 proposed_protocol 届时启用）'

precondition_blocking:
  - '**许可核验**：至少一种预训练 DL 基线须有可用代码、权重与兼容许可（协议第 87 行）。'
  - '许可不合规 ⇒ 该方法**不得纳入**（协议明文）。'
  - '批准前不得训任何模型、不得下载任何权重。'

proposed_protocol:
  selection: '从语料 DL 类条目中择 1 种，且**必须**满足：官方实现可用 + 许可兼容 + 权重可获取'
  data_split:
    train_configs: '**主实验配置之外**的配置（避免与评估集重叠）'
    val_configs: '训练配置内的留出子集'
    test_configs: '**冻结的 54 配置**（即评估集，绝不出现在训练中）'
    leakage_guard: '按**配置**（模型×噪声×档×主频）划分，不按样本随机划分，防同配置泄漏'
  seeds: '训练种子固定 3 个并全部报告；评估仅用冻结的观测种子 [101,202,303,404,505]'
  epochs: '固定上限 + early-stop（监控量 = 验证配置的 ΔSNR 宏平均）'
  early_stop: 'patience 固定；**不得按测试集调参**'
  hyperparams: '**一律取论文默认值或官方仓库默认值**，来源逐项登记；不做任何逐方法调参'
  compute: 'CPU 可跑为佳（协议第 12 行：条件性方法贡献需 CPU 可运行）'
  reporting: '报告训练种子方差；不利结果不得隐藏'

forbidden:
  - '按测试集（冻结 54 配置）调参或早停'
  - '逐方法调整超参以取得更优 ΔSNR'
  - '在批准前开始任何训练（红线）'
  - '下载许可未核验的权重'
