# ============================================================
# seismic-denoise-bench / pyproject.toml
#
# 阶段：P0.6（野外数据 + SEG-Y 采用决定）
#
# 依赖来源说明（防后续审计误判为依赖漂移）：
#   本文件依赖项来自两个授权阶段 ——
#     1) P0.2「9 包清单」（联合任务单第二部分第 2 条）；
#     2) P0.6「SEG-Y 读取库采用决定」（2026-09-25，签发方裁定）新增 segyio。
#   即：P0.2 阶段"按任务单 9 包清单"的限制，自 P0.6 采用决定起被替代；
#   新增 segyio 及其传递依赖属**授权变更**。
#
# 编码约定：UTF-8 无 BOM，LF 换行
# ============================================================

[project]
name = "seismic-denoise-bench"
version = "0.0.0"
description = "基于信息互补性分析的地震数据去噪基准与轻量融合方法（研究进行中）"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "numpy>=2.5,<3",
    "scipy>=1.18,<2",
    "matplotlib>=3.11,<4",
    "pandas>=3,<4",
    "pyyaml>=6,<7",
    "scikit-image>=0.26,<1",
    "scikit-learn>=1.9,<2",
    "PyWavelets>=1.10,<2",
    # P0.6 采用决定（2026-09-25）：SEG-Y 读取库
    # 许可 LGPL-3.0-or-later；仅作 pip 依赖调用，禁止复制源码 / 禁止 vendor。
    # 详见 docs/license-register.csv 第一节。
    "segyio>=1.9,<2",
]

[project.optional-dependencies]
dev = ["pytest>=9,<10"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# 显式声明收集模式（pytest 默认值），防止 config 漂移导致静默漏测（"假绿"）。
# 守卫见 tests/test_naming_convention.py（P0.3-Am1 裁定 3 / P0.4-Am1 裁定 1）。
python_files = ["test_*.py"]
addopts = "-ra"
