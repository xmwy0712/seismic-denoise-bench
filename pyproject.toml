# ============================================================
# seismic-denoise-bench / pyproject.toml
#
# 阶段：P0.2（环境与测试基座）
# 说明：依赖清单按联合任务单（归档件 P0.1R+P0.2 第二部分第 2 条）对齐：
#       numpy, scipy, matplotlib, pandas, pyyaml, pytest,
#       scikit-image, scikit-learn, PyWavelets。
#       SEG-Y 读取库（segyio/obspy）本单不装，留待 P0.6 按许可核验
#       （官方 LICENSE + 是否允许本项目 GitHub/Zenodo 发布方式）后单独决定，
#       结果写入 docs/license-register.csv。
#       精确版本以 requirements.lock（pip freeze 全文）为准。
# 编码约定：UTF-8 无 BOM，LF 换行
# ============================================================

[project]
name = "seismic-denoise-bench"
version = "0.0.0"
description = "基于信息互补性分析的地震数据去噪基准与轻量融合方法（研究进行中）"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "numpy>=2.5,<3",
    "scipy>=1.18,<2",
    "matplotlib>=3.11,<4",
    "pandas>=3,<4",
    "pyyaml>=6,<7",
    "scikit-image>=0.26,<1",
    "scikit-learn>=1.9,<2",
    "PyWavelets>=1.10,<2",
]

[project.optional-dependencies]
dev = ["pytest>=9,<10"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
