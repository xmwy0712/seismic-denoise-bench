# ============================================================
# seismic-denoise-bench / pyproject.toml
#
# 阶段：P0.2（环境与测试基座）
# 说明：依赖清单已在 P0.2 落定并实际安装验证；精确版本以
#       requirements.lock（pip freeze 输出）与 docs/execution-log.md 为准。
#       环境锁定文件将随 config-frozen（P1 末）一并固化。
#       在正式基准运行前不得随意新增未经验证的依赖。
# 编码约定：UTF-8 无 BOM，LF 换行
# ============================================================

[project]
name = "seismic-denoise-bench"
version = "0.0.0"
description = "基于信息互补性分析的地震数据去噪基准与轻量融合方法（研究进行中）"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "numpy>=2.5,<3",
    "scipy>=1.18,<2",
    "matplotlib>=3.11,<4",
    "pyyaml>=6,<7",
    "pandas>=3,<4",
    "pyproj>=3.8,<4",
    "PyWavelets>=1.10,<2",
    "segyio>=1.9,<2",
]

[project.optional-dependencies]
dev = ["pytest>=9,<10"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
